<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Leitor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="dashboard-body">

    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-book-open-reader"></i>
            <h2>Biblioteca</h2>
        </div>
        <nav>
            <ul>
                <li>
                    <a href="#catalogo">
                        <i class="fa-solid fa-book"></i>
                        Catálogo
                    </a>
                </li>
                <li>
                    <a href="#emprestimos">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                        Meus Empréstimos
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>Painel do Leitor</h1>
                <p>Consulte livros e acompanhe seus empréstimos</p>
            </div>
            <div class="user-area">
                <span id="readerName">Leitor</span>
                <button class="btn-danger" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Sair
                </button>
            </div>
        </header>

        <section id="catalogo" class="dashboard-section">
            <div class="section-header">
                <h2>Catálogo de Livros</h2>
                <input type="text" id="searchBook" placeholder="Pesquisar livro...">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Ano</th>
                            <th>Disponibilidade</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="catalogTable">
                        </tbody>
                </table>
            </div>
        </section>

        <section id="emprestimos" class="dashboard-section">
            <h2>Meus Empréstimos Realizados</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Livro</th>
                            <th>Data de Empréstimo</th>
                            <th>Devolução Prevista</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="myLoansTable">
                        </tbody>
                </table>
            </div>
        </section>

    </main>

    <div id="loanModal" class="modal">
        <div class="modal-content">
            <h3><i class="fa-solid fa-book-reader"></i> Solicitar Empréstimo</h3>
            <hr class="modal-divider" style="margin-bottom: 15px; border: 0; border-top: 1px solid #ddd;">
            
            <form id="loanForm" class="book-form">
                <input type="hidden" id="form_id_livro">

                <label for="form_titulo_livro">Livro Selecionado</label>
                <input type="text" id="form_titulo_livro" readonly style="background-color: #eee; cursor: not-allowed;">

                <label for="form_data_devolucao">Data Prevista para Devolução</label>
                <input type="date" id="form_data_devolucao" required>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="fecharModalEmprestimo()">
                        <i class="fa-solid fa-xmark"></i> Cancelar
                    </button>
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-check"></i> Confirmar Empréstimo
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        // Garante a inserção do nome do usuário na interface
        document.addEventListener('DOMContentLoaded', () => {
            const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
            if (usuarioLogado && usuarioLogado.nome) {
                const readerNameSpan = document.getElementById('readerName');
                if (readerNameSpan) readerNameSpan.textContent = usuarioLogado.nome;
            }
        });
    </script>
    <script src="js/app.js"></script>
    <script src="js/leitor.js"></script>

</body>

</html>
